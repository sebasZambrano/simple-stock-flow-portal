server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The service decides the 5 MB limit and answers 422 with a sentence a person can read
    # (api-contract.md E-08). A smaller cap here would answer 413 in HTML instead and that
    # sentence would never be reachable through the portal, so this matches the only physical
    # ceiling left: the 30 000 000 bytes Kestrel refuses to read past.
    client_max_body_size 30m;

    # Docker hands each container a new address every time it is recreated. Resolving the
    # upstream once at startup left nginx proxying to the address the service used to have and
    # answering 502 until someone restarted the portal, which happens on every backend rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The API and the binary assets live in the service, not here.
    # `^~` is what makes /media/ win: nginx tries regular expressions before prefixes, so the
    # static-asset block below used to swallow /media/*.jpg and /media/*.png and answer them
    # with its own 404 page — of the three content types the API accepts, only webp ever
    # reached the browser (defect A-6, CA-03.1).
    location ^~ /media/ {
        set $media_upstream "service:8080";
        # With a variable in proxy_pass nginx stops rewriting the path, so it travels verbatim.
        proxy_pass http://$media_upstream$request_uri;
        # $http_host and not $host: $host drops the port, so anything the service builds from the
        # Host header comes back pointing at port 80, where nothing is listening (defect A-9).
        proxy_set_header Host $http_host;
    }

    # The API documents itself and the service is the only one who can serve that page, so it
    # has to survive the trip through the portal. `^~` for the same reason /media/ needs it:
    # swagger-ui asks for swagger-ui.css and swagger-ui-bundle.js, and a prefix that does not
    # win outright loses them to the static-asset regular expression below, which would answer
    # with this container's own 404 and leave an unstyled, scriptless page (defect A-6 again).
    # No trailing slash: /swagger itself has to match, or its redirect never happens.
    location ^~ /swagger {
        set $swagger_upstream "service:8080";
        proxy_pass http://$swagger_upstream$request_uri;
        # $http_host and not $host: $host drops the port, and the page would then read its own
        # address as port 80 and send every "Try it out" somewhere nothing is listening.
        proxy_set_header Host $http_host;
    }

    # `^~` for the third time, and this one was the leftover: when A-6 was fixed /media/ and
    # /swagger got it and /api/ did not, so an API path ending in .jpg or .css was still answered
    # by this container's own 404 page instead of reaching the service (defect A-11). It never
    # bit because no route of the contract ends that way -- which is luck, not a guarantee.
    location ^~ /api/ {
        set $api_upstream "service:8080";
        proxy_pass http://$api_upstream$request_uri;
        # $host drops the port, and the Location of a 201 is built from this header: through the
        # portal it came back as http://localhost/api/products/{id}, one port short of anywhere
        # a client can follow (defect A-9, contract E-05 and E-10).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The hashed bundle is immutable; the index is never cached.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular routes: everything else falls through to the index.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
